name: Renderer validation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      hardware:
        description: Run on an explicitly provisioned WebGPU hardware runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RENDERER_GPU_PROFILE: software
      RENDERER_BROWSER_CHANNEL: chromium
      RENDERER_VALIDATION_PROGRESS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm validate > validation.log 2>&1
      - run: pnpm benchmark:gpu --long-animation > benchmark.log 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: software-validation
          path: |
            *.log
            artifacts/
  hardware:
    if: github.event_name == 'workflow_dispatch' && inputs.hardware
    runs-on: [self-hosted, linux, webgpu]
    timeout-minutes: 60
    env:
      RENDERER_GPU_PROFILE: hardware
      RENDERER_BROWSER_CHANNEL: chromium
      RENDERER_VALIDATION_PROGRESS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm validate > validation.log 2>&1
      - run: pnpm benchmark:gpu --long-animation > benchmark.log 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hardware-validation
          path: |
            *.log
            artifacts/
